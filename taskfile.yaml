version: "3"

tasks:
  gen:
    desc: Generate the Go module
    cmds:
      - buf generate
      - go mod tidy
      - go build ./...

  update:
    desc: Update dependencies
    cmds:
      - cd nokku && buf dep update
      - go get -u ./...
      - go mod tidy

  lint:
    desc: Lint
    cmds:
      - cd nokku && buf format -d --exit-code
      - cd nokku && buf lint
