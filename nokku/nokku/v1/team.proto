edition = "2023";

package nokku.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "nokku/v1/workspace.proto";

service TeamService {
  rpc GetTeam(GetTeamRequest) returns (GetTeamResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/teams/{id}"};
  }
  rpc ListTeams(ListTeamsRequest) returns (ListTeamsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/workspaces/{workspace_id}/teams"};
  }
  rpc CreateTeam(CreateTeamRequest) returns (CreateTeamResponse) {
    option (google.api.http) = {
      post: "/v1/workspaces/{workspace_id}/teams"
      body: "*"
    };
  }
  rpc UpdateTeam(UpdateTeamRequest) returns (UpdateTeamResponse) {
    option (google.api.http) = {
      patch: "/v1/teams/{id}"
      body: "*"
    };
  }
  rpc DeleteTeam(DeleteTeamRequest) returns (DeleteTeamResponse) {
    option (google.api.http) = {delete: "/v1/teams/{id}"};
  }
  rpc AddTeamMember(AddTeamMemberRequest) returns (AddTeamMemberResponse) {
    option (google.api.http) = {post: "/v1/teams/{team_id}/members/{user_id}"};
  }
  rpc RemoveTeamMember(RemoveTeamMemberRequest) returns (RemoveTeamMemberResponse) {
    option (google.api.http) = {delete: "/v1/teams/{team_id}/members/{user_id}"};
  }
}

message Team {
  string id = 1;
  string workspace_id = 2;
  string name = 3;
  string description = 4;
  repeated string tags = 5;
  repeated WorkspaceMember members = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp updated_at = 8;
}

message GetTeamRequest {
  string workspace_id = 1 [(buf.validate.field).string.uuid = true];
  string id = 2 [(buf.validate.field).string.uuid = true];
}
message GetTeamResponse {
  Team team = 1;
}

message CreateTeamRequest {
  string workspace_id = 1 [(buf.validate.field).string.uuid = true];
  string name = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  string description = 3 [(buf.validate.field).string.max_len = 1000];
  repeated string tags = 4;
}
message CreateTeamResponse {
  Team team = 1;
}

message UpdateTeamRequest {
  string workspace_id = 1 [(buf.validate.field).string.uuid = true];
  string id = 2 [(buf.validate.field).string.uuid = true];
  string name = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  string description = 4 [(buf.validate.field).string.max_len = 1000];
  repeated string tags = 5;
}
message UpdateTeamResponse {
  Team team = 1;
}

message DeleteTeamRequest {
  string workspace_id = 1 [(buf.validate.field).string.uuid = true];
  string id = 2 [(buf.validate.field).string.uuid = true];
}
message DeleteTeamResponse {}

message ListTeamsRequest {
  string workspace_id = 1 [(buf.validate.field).string.uuid = true];
  int32 limit = 2 [(buf.validate.field).int32 = {
    gte: 1
    lte: 100
  }];
  int32 offset = 3 [(buf.validate.field).int32.gte = 0];
  string query = 4;
  repeated string tags = 5;
}
message ListTeamsResponse {
  repeated Team teams = 1;
  int32 total = 2;
}

message AddTeamMemberRequest {
  string workspace_id = 1 [(buf.validate.field).string.uuid = true];
  string team_id = 2 [(buf.validate.field).string.uuid = true];
  string user_id = 3 [(buf.validate.field).string.uuid = true];
}
message AddTeamMemberResponse {}

message RemoveTeamMemberRequest {
  string workspace_id = 1 [(buf.validate.field).string.uuid = true];
  string team_id = 2 [(buf.validate.field).string.uuid = true];
  string user_id = 3 [(buf.validate.field).string.uuid = true];
}
message RemoveTeamMemberResponse {}
