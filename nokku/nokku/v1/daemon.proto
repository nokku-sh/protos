edition = "2023";

package nokku.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "nokku/v1/access.proto";

service DaemonService {
  rpc GetDaemon(GetDaemonRequest) returns (GetDaemonResponse) {
    option (access) = {role: WORKSPACE_ROLE_VIEWER};
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/workspaces/{workspace_id}/daemons/{id}"};
  }
  rpc UpdateDaemon(UpdateDaemonRequest) returns (UpdateDaemonResponse) {
    option (access) = {role: WORKSPACE_ROLE_EDITOR};
    option (google.api.http) = {
      patch: "/v1/workspaces/{workspace_id}/daemons/{id}"
      body: "*"
    };
  }
  // A daemon may only delete its own record, the handler narrows it.
  rpc DeleteDaemon(DeleteDaemonRequest) returns (DeleteDaemonResponse) {
    option (access) = {
      role: WORKSPACE_ROLE_EDITOR
      daemon: true
    };
    option (google.api.http) = {delete: "/v1/workspaces/{workspace_id}/daemons/{id}"};
  }
  rpc ListDaemons(ListDaemonsRequest) returns (ListDaemonsResponse) {
    option (access) = {role: WORKSPACE_ROLE_VIEWER};
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/workspaces/{workspace_id}/daemons"};
  }
  rpc ListSessions(ListSessionsRequest) returns (ListSessionsResponse) {
    option (access) = {role: WORKSPACE_ROLE_VIEWER};
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/workspaces/{workspace_id}/daemons/{daemon_id}/sessions"};
  }
  // A web session only opens the transport, sshd still checks the cert against synced grants.
  rpc CreateSession(CreateSessionRequest) returns (CreateSessionResponse) {
    option (access) = {role: WORKSPACE_ROLE_MEMBER};
    option (google.api.http) = {
      post: "/v1/workspaces/{workspace_id}/daemons/{daemon_id}/sessions"
      body: "*"
    };
  }
  rpc CloseSession(CloseSessionRequest) returns (CloseSessionResponse) {
    option (access) = {role: WORKSPACE_ROLE_EDITOR};
    option (google.api.http) = {delete: "/v1/workspaces/{workspace_id}/daemons/{daemon_id}/sessions/{session_id}"};
  }
  rpc EnrollDaemon(EnrollDaemonRequest) returns (EnrollDaemonResponse) {
    option (access) = {public: true};
  }
  rpc SyncDaemon(SyncDaemonRequest) returns (SyncDaemonResponse) {
    option (access) = {daemon: true};
  }
  // Streams are self-scoped since their workspace only arrives with the first message.
  rpc Relay(stream RelayRequest) returns (stream RelayResponse) {
    option (access) = {self: true};
  }
}

service DaemonControlService {
  rpc Connect(stream ConnectRequest) returns (stream ConnectResponse) {
    option (access) = {daemon: true};
  }
}

service DaemonSessionService {
  rpc DaemonRelay(stream DaemonRelayRequest) returns (stream DaemonRelayResponse) {
    option (access) = {daemon: true};
  }
}

enum DaemonStatus {
  DAEMON_STATUS_UNSPECIFIED = 0;
  DAEMON_STATUS_PENDING = 1;
  DAEMON_STATUS_ACCEPTED = 2;
  DAEMON_STATUS_REJECTED = 3;
}

message Daemon {
  string id = 1;
  string workspace_id = 2;
  string name = 3;
  bool online = 4; // Derived from last_seen_at: seen by a core instance in the last 30 seconds.
  DaemonStatus status = 5;
  DaemonConfig config = 6;
  map<string, string> metadata = 7;
  google.protobuf.Timestamp updated_at = 8;
  google.protobuf.Timestamp created_at = 9;
  google.protobuf.Timestamp last_seen_at = 10;
}

message DaemonConfig {
  bool record_sessions = 1;
  bool allow_forwarding = 2;
  bool allow_agent_forwarding = 3;
  bool gateway_ports = 4;
  bool drop_retired_ca = 5;
}

message GetDaemonRequest {
  string workspace_id = 1 [(buf.validate.field).string.uuid = true];
  string id = 2 [(buf.validate.field).string.uuid = true];
}
message GetDaemonResponse {
  Daemon daemon = 1;
}

message UpdateDaemonRequest {
  string workspace_id = 1 [(buf.validate.field).string.uuid = true];
  string id = 2 [(buf.validate.field).string.uuid = true];
  DaemonStatus status = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0] /* Prevent UNSPECIFIED */
  }];
  DaemonConfig config = 4;
}

message UpdateDaemonResponse {}

message DeleteDaemonRequest {
  string workspace_id = 1 [(buf.validate.field).string.uuid = true];
  string id = 2 [(buf.validate.field).string.uuid = true];
}
message DeleteDaemonResponse {}

message ListDaemonsRequest {
  string workspace_id = 1 [(buf.validate.field).string.uuid = true];
  int32 limit = 2 [(buf.validate.field).int32 = {
    gte: 1
    lte: 100
  }];
  int32 offset = 3 [(buf.validate.field).int32.gte = 0];
  string query = 4;
  bool online = 5;
  DaemonStatus status = 6;
}
message ListDaemonsResponse {
  repeated Daemon daemons = 1;
  int32 total = 2;
}

message CreateSessionRequest {
  string workspace_id = 1 [(buf.validate.field).string.uuid = true];
  string daemon_id = 2 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).required = true
  ];
  string username = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 32
    pattern: "^[A-Za-z_][A-Za-z0-9._-]*\\$?$"
  }];
}
message CreateSessionResponse {
  DaemonSession session = 1;
  string daemon_name = 2;
}

message ListSessionsRequest {
  string workspace_id = 1 [(buf.validate.field).string.uuid = true];
  string daemon_id = 2 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).required = true
  ];
}
message ListSessionsResponse {
  repeated DaemonSession sessions = 1;
  string daemon_name = 2;
}

message CloseSessionRequest {
  string workspace_id = 1 [(buf.validate.field).string.uuid = true];
  string daemon_id = 2 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).required = true
  ];
  string session_id = 3 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).required = true
  ];
}
message CloseSessionResponse {}

message EnrollDaemonRequest {
  string token = 1 [(buf.validate.field).string.min_len = 1];
}
message EnrollDaemonResponse {
  string id = 1;
  string workspace_id = 2;
  string target_id = 3;
  DaemonStatus status = 4;
  DaemonConfig config = 5;
  string access_token = 6;
}

message PrincipalUsers {
  string username = 1;
  repeated string ids = 2;
}

message SyncDaemonRequest {
  repeated string users = 1;
  repeated string private_ips = 2;
  map<string, string> metadata = 3;
}

message SyncDaemonResponse {
  DaemonStatus status = 1;
  DaemonConfig config = 2;
  repeated PrincipalUsers principals = 3;
  int64 state_version = 4;
  string ca_public_key = 5;
}

// Control Stream -------------------------------------------------------------

message ConnectRequest {
  oneof msg {
    Heartbeat heartbeat = 1;
  }
}

message ConnectResponse {
  oneof msg {
    StateUpdate state_update = 1;
    RelayOpen relay_open = 2;
  }
}

message Heartbeat {
  int64 state_version = 1;
}

// StateUpdate tells the daemon to re-sync now.
message StateUpdate {}

message DaemonSession {
  string session_id = 1;
  string username = 2;
  string user_id = 3;
}

// Relay Stream --------------------------------------------------------------

message RelayOpen {
  string relay_id = 1;
}

message RelayStart {
  string workspace_id = 1 [(buf.validate.field).string.uuid = true];
  string daemon_id = 2 [
    (buf.validate.field).string.uuid = true,
    (buf.validate.field).required = true
  ];
}

message RelayRequest {
  oneof msg {
    RelayStart start = 1;
    bytes data = 2;
  }
}

message RelayReady {
  string relay_id = 1;
}

message RelayResponse {
  oneof msg {
    RelayReady ready = 1;
    bytes data = 2;
    RelayClosed closed = 3;
  }
}

message RelayClosed {
  string reason = 1;
}

message DaemonRelayRequest {
  oneof msg {
    DaemonRelayReady ready = 1;
    bytes data = 2;
    DaemonRelayClosed closed = 3;
  }
}

message DaemonRelayResponse {
  oneof msg {
    bytes data = 1;
    DaemonRelayClosed closed = 2;
  }
}

message DaemonRelayReady {
  string relay_id = 1;
}

message DaemonRelayClosed {
  string reason = 1;
}
