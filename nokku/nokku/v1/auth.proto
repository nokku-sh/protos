edition = "2023";

package nokku.v1;

import "buf/validate/validate.proto";
import "nokku/v1/access.proto";
import "nokku/v1/account.proto";

service AuthService {
  rpc Register(RegisterRequest) returns (RegisterResponse) {
    option (access) = {public: true};
  }
  rpc Login(LoginRequest) returns (LoginResponse) {
    option (access) = {public: true};
  }
  rpc LoginWithBackupCode(LoginWithBackupCodeRequest) returns (LoginWithBackupCodeResponse) {
    option (access) = {public: true};
  }
  // Public so a stale session can still clear its cookie.
  rpc Logout(LogoutRequest) returns (LogoutResponse) {
    option (access) = {public: true};
  }
  rpc ForgotPassword(ForgotPasswordRequest) returns (ForgotPasswordResponse) {
    option (access) = {public: true};
  }
  rpc ResetPassword(ResetPasswordRequest) returns (ResetPasswordResponse) {
    option (access) = {public: true};
  }
  rpc VerifyEmail(VerifyEmailRequest) returns (VerifyEmailResponse) {
    option (access) = {public: true};
  }
  rpc ResendVerification(ResendVerificationRequest) returns (ResendVerificationResponse) {
    option (access) = {public: true};
  }
  // Takes the token mailed to the new address and switches the account to it.
  rpc ConfirmEmailChange(ConfirmEmailChangeRequest) returns (ConfirmEmailChangeResponse) {
    option (access) = {public: true};
  }
  // Takes the token mailed to the old address. Drops a pending change, or
  // puts the old address back when the change already happened.
  rpc CancelEmailChange(CancelEmailChangeRequest) returns (CancelEmailChangeResponse) {
    option (access) = {public: true};
  }
  rpc DiscoverSSO(DiscoverSSORequest) returns (DiscoverSSOResponse) {
    option (access) = {public: true};
    option idempotency_level = NO_SIDE_EFFECTS;
  }
}

message RegisterRequest {
  string name = 1 [(buf.validate.field).string.max_len = 256];
  string email = 2 [(buf.validate.field).string.email = true];
  string password = 3 [(buf.validate.field).string = {
    min_len: 8
    max_len: 128
  }];
}
message RegisterResponse {}

message LoginRequest {
  string email = 1 [(buf.validate.field).string.email = true];
  string password = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 128
  }];
}
message LoginResponse {
  User user = 1;
}

message LoginWithBackupCodeRequest {
  string email = 1 [(buf.validate.field).string.email = true];
  string code = 2 [(buf.validate.field).string.min_len = 1];
}
message LoginWithBackupCodeResponse {
  User user = 1;
}

message LogoutRequest {}
message LogoutResponse {}

message ForgotPasswordRequest {
  string email = 1 [(buf.validate.field).string.email = true];
}
message ForgotPasswordResponse {}

message ResetPasswordRequest {
  string token = 1 [(buf.validate.field).string.min_len = 1];
  string new_password = 2 [(buf.validate.field).string = {
    min_len: 8
    max_len: 128
  }];
}
message ResetPasswordResponse {}

message VerifyEmailRequest {
  string token = 1 [(buf.validate.field).string.min_len = 1];
}
message VerifyEmailResponse {}

message ConfirmEmailChangeRequest {
  string token = 1 [(buf.validate.field).string.min_len = 1];
}
message ConfirmEmailChangeResponse {}

message CancelEmailChangeRequest {
  string token = 1 [(buf.validate.field).string.min_len = 1];
}
message CancelEmailChangeResponse {}

message ResendVerificationRequest {
  string email = 1 [(buf.validate.field).string.email = true];
}
message ResendVerificationResponse {}

message DiscoverSSORequest {
  string email = 1 [(buf.validate.field).string.email = true];
}
message DiscoverSSOResponse {
  bool has_sso = 1;
  bool enforce = 2;
  repeated SSOProviderInfo providers = 3;
}

message SSOProviderInfo {
  string method = 1;
  string provider = 2;
  string name = 3;
}
