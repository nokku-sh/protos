edition = "2023";

package nokku.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

service CredentialService {
  // Passwords
  rpc UpdatePassword(UpdatePasswordRequest) returns (UpdatePasswordResponse) {
    option (google.api.http) = {
      patch: "/v1/credentials/password"
      body: "*"
    };
  }
  rpc DeletePassword(DeletePasswordRequest) returns (DeletePasswordResponse) {
    option (google.api.http) = {delete: "/v1/credentials/password"};
  }
  // Passkeys
  rpc ListPasskeys(ListPasskeysRequest) returns (ListPasskeysResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/credentials/passkeys"};
  }
  rpc DeletePasskey(DeletePasskeyRequest) returns (DeletePasskeyResponse) {
    option (google.api.http) = {delete: "/v1/credentials/passkeys/{id}"};
  }
  rpc RenamePasskey(RenamePasskeyRequest) returns (RenamePasskeyResponse) {
    option (google.api.http) = {
      patch: "/v1/credentials/passkeys/{id}"
      body: "*"
    };
  }
  // Backup codes
  rpc CreateBackupCodes(CreateBackupCodesRequest) returns (CreateBackupCodesResponse) {
    option (google.api.http) = {post: "/v1/credentials/backup-codes"};
  }
  rpc ListBackupCodes(ListBackupCodesRequest) returns (ListBackupCodesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/credentials/backup-codes"};
  }
  rpc DeleteBackupCodes(DeleteBackupCodesRequest) returns (DeleteBackupCodesResponse) {
    option (google.api.http) = {delete: "/v1/credentials/backup-codes"};
  }
}

// Password messages ----------------------------------------------------------
message UpdatePasswordRequest {
  string current_password = 1 [(buf.validate.field).string.min_len = 1];
  string new_password = 2 [(buf.validate.field).string.min_len = 8];
}
message UpdatePasswordResponse {}

message DeletePasswordRequest {
  string current_password = 1 [(buf.validate.field).string.min_len = 1];
}
message DeletePasswordResponse {}

// Passkey messages -----------------------------------------------------------
message Passkey {
  string id = 1;
  google.protobuf.Timestamp created_at = 2;
  string name = 3;
}

message ListPasskeysRequest {}
message ListPasskeysResponse {
  repeated Passkey passkeys = 1;
}

message DeletePasskeyRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
}
message DeletePasskeyResponse {}

message RenamePasskeyRequest {
  string id = 1 [(buf.validate.field).string.min_len = 1];
  string name = 2;
}
message RenamePasskeyResponse {}

// Backup code messages -------------------------------------------------------
message BackupCode {
  string id = 1;
  google.protobuf.Timestamp created_at = 2;
}
message CreateBackupCodesRequest {}
message CreateBackupCodesResponse {
  repeated string codes = 1;
}

message ListBackupCodesRequest {}
message ListBackupCodesResponse {
  repeated BackupCode codes = 1;
}
message DeleteBackupCodesRequest {}
message DeleteBackupCodesResponse {}
