edition = "2023";

package nokku.v1;

import "google/protobuf/timestamp.proto";

message User {
  string id = 1;
  string name = 2;
  string email = 3;
  bool email_verified = 4;
  string picture = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  bool enable_email_recovery = 8;
}
