edition = "2023";

package nokku.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";
import "nokku/v1/access.proto";

service PrincipalService {
  rpc ListPrincipals(ListPrincipalsRequest) returns (ListPrincipalsResponse) {
    option (access) = {role: WORKSPACE_ROLE_VIEWER};
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/workspaces/{workspace_id}/principals"};
  }
  rpc AddPrincipal(AddPrincipalRequest) returns (AddPrincipalResponse) {
    option (access) = {role: WORKSPACE_ROLE_EDITOR};
    option (google.api.http) = {
      post: "/v1/workspaces/{workspace_id}/principals/accounts"
      body: "*"
    };
  }
  rpc RemovePrincipal(RemovePrincipalRequest) returns (RemovePrincipalResponse) {
    option (access) = {role: WORKSPACE_ROLE_EDITOR};
    option (google.api.http) = {
      post: "/v1/workspaces/{workspace_id}/principals/accounts:remove"
      body: "*"
    };
  }
  rpc AddSubjectsToPrincipal(AddSubjectsToPrincipalRequest) returns (AddSubjectsToPrincipalResponse) {
    option (access) = {role: WORKSPACE_ROLE_EDITOR};
    option (google.api.http) = {
      post: "/v1/workspaces/{workspace_id}/principals:add"
      body: "*"
    };
  }
  rpc RemoveSubjectsFromPrincipal(RemoveSubjectsFromPrincipalRequest) returns (RemoveSubjectsFromPrincipalResponse) {
    option (access) = {role: WORKSPACE_ROLE_EDITOR};
    option (google.api.http) = {
      post: "/v1/workspaces/{workspace_id}/principals:remove"
      body: "*"
    };
  }
  rpc RevokeAllAccess(RevokeAllAccessRequest) returns (RevokeAllAccessResponse) {
    option (access) = {role: WORKSPACE_ROLE_EDITOR};
    option (google.api.http) = {
      post: "/v1/workspaces/{workspace_id}/principals:revoke"
      body: "*"
    };
  }
}

// SubjectKind is who a grant is for. A Principal is the local account.
enum SubjectKind {
  SUBJECT_KIND_UNSPECIFIED = 0;
  SUBJECT_KIND_USER = 1;
  SUBJECT_KIND_TEAM = 2;
  SUBJECT_KIND_SERVICE_ACCOUNT = 3;
}

message Principal {
  string id = 1;
  string target_id = 2;
  string username = 3;
  repeated string user_ids = 4;
  repeated string team_ids = 5;
  repeated string service_account_ids = 6;
  google.protobuf.Timestamp created_at = 7;
}

message ListPrincipalsRequest {
  string workspace_id = 1 [(buf.validate.field).string.uuid = true];
  string target_id = 2 [(buf.validate.field).string.uuid = true];
  int32 limit = 3 [(buf.validate.field).int32 = {
    gte: 1
    lte: 100
  }];
  int32 offset = 4 [(buf.validate.field).int32.gte = 0];
  string query = 5;
}
message ListPrincipalsResponse {
  repeated Principal principals = 1;
  int32 total = 2;
}

message AddSubjectsToPrincipalRequest {
  string workspace_id = 1 [(buf.validate.field).string.uuid = true];
  string id = 2 [(buf.validate.field).string.uuid = true];
  repeated string subject_ids = 3 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 50
    items: {
      string: {uuid: true}
    }
  }];
  SubjectKind kind = 4 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
}
message AddSubjectsToPrincipalResponse {}

message RemoveSubjectsFromPrincipalRequest {
  string workspace_id = 1 [(buf.validate.field).string.uuid = true];
  string id = 2 [(buf.validate.field).string.uuid = true];
  repeated string subject_ids = 3 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 50
    items: {
      string: {uuid: true}
    }
  }];
  SubjectKind kind = 4 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
}
message RemoveSubjectsFromPrincipalResponse {}

message RevokeAllAccessRequest {
  string subject_id = 1 [(buf.validate.field).string.uuid = true];
  string workspace_id = 2 [(buf.validate.field).string.uuid = true];
  SubjectKind kind = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
}
message RevokeAllAccessResponse {}

message AddPrincipalRequest {
  string workspace_id = 1 [(buf.validate.field).string.uuid = true];
  string target_id = 2 [(buf.validate.field).string.uuid = true];
  string username = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 32
    pattern: "^[A-Za-z_][A-Za-z0-9._-]*\\$?$"
  }];
}
message AddPrincipalResponse {
  Principal principal = 1;
}

message RemovePrincipalRequest {
  string workspace_id = 1 [(buf.validate.field).string.uuid = true];
  string id = 2 [(buf.validate.field).string.uuid = true];
}
message RemovePrincipalResponse {}
