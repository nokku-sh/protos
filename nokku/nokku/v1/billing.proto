edition = "2023";

package nokku.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

service BillingService {
  rpc GetBilling(GetBillingRequest) returns (GetBillingResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/billing/subscription"};
  }
  rpc CreatePortal(CreatePortalRequest) returns (CreatePortalResponse) {
    option (google.api.http) = {post: "/v1/billing/portal"};
  }
  rpc CreateCheckout(CreateCheckoutRequest) returns (CreateCheckoutResponse) {
    option (google.api.http) = {post: "/v1/billing/checkout"};
  }
  rpc CancelSubscription(CancelSubscriptionRequest) returns (CancelSubscriptionResponse) {
    option (google.api.http) = {
      post: "/v1/billing/subscription/cancel"
      body: "*"
    };
  }
  rpc GetLicense(GetLicenseRequest) returns (GetLicenseResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/license"};
  }
}

message GetBillingRequest {
  string workspace_id = 1 [(buf.validate.field).string.uuid = true];
}
message GetBillingResponse {
  string plan = 1;
  string mode = 2;
  map<string, bool> features = 3;
  Quotas quotas = 4;
  int64 member_count = 5;
  int64 resource_count = 6;
  Subscription subscription = 7;
}

message Quotas {
  int64 seats = 1;
  int64 retention_days = 2;
  int64 recording_storage_bytes = 3;
  int64 resource_cap = 4;
}

message Subscription {
  string status = 1;
  bool cancel_at_period_end = 2;
  google.protobuf.Timestamp current_period_end = 3;
}

message CreatePortalRequest {
  string workspace_id = 1 [(buf.validate.field).string.uuid = true];
}
message CreatePortalResponse {
  string url = 1;
}

message CreateCheckoutRequest {
  string workspace_id = 1 [(buf.validate.field).string.uuid = true];
}
message CreateCheckoutResponse {
  string url = 1;
}

message CancelSubscriptionRequest {
  string workspace_id = 1 [(buf.validate.field).string.uuid = true];
  bool immediate = 2;
  string reason = 3 [(buf.validate.field).string.max_len = 1000];
}
message CancelSubscriptionResponse {}

message GetLicenseRequest {}
message GetLicenseResponse {
  string plan = 1;
  bool active = 2;
  google.protobuf.Timestamp expires_at = 3;
}
