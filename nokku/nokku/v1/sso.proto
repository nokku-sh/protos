edition = "2023";

package nokku.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

service SSOService {
  rpc GetOIDCProvider(GetOIDCProviderRequest) returns (GetOIDCProviderResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/workspaces/{workspace_id}/oidc"};
  }
  rpc UpdateOIDCProvider(UpdateOIDCProviderRequest) returns (UpdateOIDCProviderResponse) {
    option (google.api.http) = {
      patch: "/v1/workspaces/{workspace_id}/oidc"
      body: "*"
    };
  }
  rpc GetSAMLProvider(GetSAMLProviderRequest) returns (GetSAMLProviderResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/workspaces/{workspace_id}/saml"};
  }
  rpc UpdateSAMLProvider(UpdateSAMLProviderRequest) returns (UpdateSAMLProviderResponse) {
    option (google.api.http) = {
      patch: "/v1/workspaces/{workspace_id}/saml"
      body: "*"
    };
  }
  // Public endpoint
  rpc CheckSSO(CheckSSORequest) returns (CheckSSOResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/sso/{email}"};
  }
}

// OIDC messages --------------------------------------------------------------

message OIDCProvider {
  string workspace_id = 1;
  string name = 2;
  string issuer_url = 3;
  string client_id = 4;
  repeated string scopes = 5;
  string email_claim = 6;
  string name_claim = 7;
  string username_claim = 8;
  string picture_claim = 9;
  bool enforce_sso = 10;
  bool allow_jit_provisioning = 11;
  bool use_pkce = 12;
  bool is_active = 13;
  google.protobuf.Timestamp created_at = 14;
  google.protobuf.Timestamp updated_at = 15;
}

message GetOIDCProviderRequest {
  string workspace_id = 1 [(buf.validate.field).string.uuid = true];
}
message GetOIDCProviderResponse {
  OIDCProvider oidc_provider = 1;
}

message UpdateOIDCProviderRequest {
  string workspace_id = 1 [(buf.validate.field).string.uuid = true];
  string name = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  string issuer_url = 3 [(buf.validate.field).string = {
    uri: true
    // prefix: "https://" // TODO: Must be HTTPS
  }];
  string client_id = 4 [(buf.validate.field).string = {
    min_len: 1
    max_len: 500
  }];
  string client_secret = 5 [(buf.validate.field).string = {
    min_len: 1
    max_len: 1000
  }];
  repeated string scopes = 6 [(buf.validate.field).repeated = {
    min_items: 1
    max_items: 20
    items: {
      string: {
        min_len: 1
        max_len: 100
      }
    }
  }];
  string email_claim = 7;
  string name_claim = 8;
  string username_claim = 9;
  string picture_claim = 10;
  bool enforce_sso = 11;
  bool allow_jit_provisioning = 12;
  bool use_pkce = 13;
  bool is_active = 14;
}
message UpdateOIDCProviderResponse {
  OIDCProvider oidc_provider = 1;
}

// SAML messages --------------------------------------------------------------

message SAMLProvider {
  string workspace_id = 1;
  string name = 2;
  string metadata_url = 3;
  string email_attribute = 4;
  string name_attribute = 5;
  string username_attribute = 6;
  string picture_attribute = 7;
  bool enforce_sso = 8;
  bool allow_jit_provisioning = 9;
  bool is_active = 10;
  google.protobuf.Timestamp created_at = 11;
  google.protobuf.Timestamp updated_at = 12;
}

message GetSAMLProviderRequest {
  string workspace_id = 1 [(buf.validate.field).string.uuid = true];
}
message GetSAMLProviderResponse {
  SAMLProvider saml_provider = 1;
}

message UpdateSAMLProviderRequest {
  string workspace_id = 1 [(buf.validate.field).string.uuid = true];
  string name = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  string metadata_url = 3 [(buf.validate.field).string = {
    uri: true
    // prefix: "https://" // TODO: Must be HTTPS
  }];
  string email_attribute = 4;
  string name_attribute = 5;
  string username_attribute = 6;
  string picture_attribute = 7;
  bool enforce_sso = 8;
  bool allow_jit_provisioning = 9;
  bool is_active = 10;
}
message UpdateSAMLProviderResponse {
  SAMLProvider saml_provider = 1;
}

message SSOProvider {
  enum Type {
    TYPE_UNSPECIFIED = 0;
    TYPE_OIDC = 1;
    TYPE_SAML = 2;
  }
  Type type = 1;
  string id = 2;
  string name = 3;
}

message CheckSSORequest {
  string email = 1 [(buf.validate.field).string = {
    email: true
    max_len: 256
  }];
}
message CheckSSOResponse {
  bool has_sso = 1;
  bool enforce_sso = 2;
  repeated SSOProvider providers = 3;
}
