edition = "2023";

package nokku.v1;

import "buf/validate/validate.proto";
import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

service SSOService {
  rpc GetSSOProvider(GetSSOProviderRequest) returns (GetSSOProviderResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (google.api.http) = {get: "/v1/workspaces/{workspace_id}/sso"};
  }
  rpc UpdateSSOProvider(UpdateSSOProviderRequest) returns (UpdateSSOProviderResponse) {
    option (google.api.http) = {
      patch: "/v1/workspaces/{workspace_id}/sso"
      body: "*"
    };
  }
}

message SSOProvider {
  string workspace_id = 1;
  string method = 2; // oidc | saml
  string name = 3;
  bool enforce_sso = 4;
  bool allow_jit_provisioning = 5;
  bool is_active = 6;
  SSOConfig config = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp updated_at = 9;
}

message SSOConfig {
  string issuer_url = 1;
  string client_id = 2;
  repeated string scopes = 3;
  string metadata_url = 4;
}

message GetSSOProviderRequest {
  string workspace_id = 1 [(buf.validate.field).string.uuid = true];
}
message GetSSOProviderResponse {
  SSOProvider provider = 1; // unset when the workspace has no provider
}

message UpdateSSOProviderRequest {
  string workspace_id = 1 [(buf.validate.field).string.uuid = true];
  string method = 2 [(buf.validate.field).string = {
    in: [
      "oidc",
      "saml"
    ]
  }];
  string name = 3 [(buf.validate.field).string = {
    min_len: 1
    max_len: 256
  }];
  bool enforce_sso = 4;
  bool allow_jit_provisioning = 5;
  bool is_active = 6;
  string client_secret = 7 [(buf.validate.field).string = {max_len: 1000}];
  SSOConfig config = 8;
}
message UpdateSSOProviderResponse {
  SSOProvider provider = 1;
}
